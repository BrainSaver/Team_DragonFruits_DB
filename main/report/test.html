<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>접기/열기 버튼</title>
  <style>
    .content {
      display: none;
      padding: 10px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }
    .button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      border-radius: 5px;
    }
    .button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <button class="button" onclick="toggleContent()">내용 보기</button>
  <div id="content" class="content">
    <pre id="output"></pre>
  </div>

  <script>
    function toggleContent() {
      const content = document.getElementById('content');
      const button = document.querySelector('.button');
      if (content.style.display === 'none' || content.style.display === '') {
        content.style.display = 'block';
        button.textContent = '내용 숨기기';
      } else {
        content.style.display = 'none';
        button.textContent = '내용 보기';
      }
    }
  </script>
  <script>
    const Filename = `
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="StyleSheet" href="./table.css" type="text/css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디 찾기</title>
    <style>

    </style>
</head>
<body>
    <div class="login-box">
        <h2>아이디 찾기</h2>
        <form method="POST" action="./findIDReply.php">
            <div class="form-group">
                <label for="email">이메일:</label>
                <input type="text" id="email" name="email" required> <!-- name 없어서 안된거였노~ -->
            </div>
            <input type="submit" value="찾기">
        </form>
    </div>
</body>
</html>
    `;
    const output = document.getElementById('output');
    output.textContent = Filename;
  </script>
</body>
</html>
