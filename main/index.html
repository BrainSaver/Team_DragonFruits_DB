<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-around;
            background-color: #f4f4f4;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .header div {
            padding: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            text-align: center;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }
        .box {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            background: #fafafa;
            height: 350px;
        }
        .map {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #666;
        }
        .chart {
            text-align: center;
        }
        .pie-charts {
            display: flex;
            justify-content: space-around;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <header class="header">
        <div>금 +19%</div>
        <div>은 +12</div>
        <div>구리 -11</div>
        <div>석유 +3</div>
        <div>석탄 -17</div>
        <div>가스 +61</div>
        <div>철 +17</div>
    </header>
    <main class="container">
        <div class="box map">
            구글 지도 위치 표시
        </div>
        <div class="box news">

                <iframe src="dashboard/news.html" id="contentFrame"></iframe>

        </div>
        <div class="box chart">
            <h3>차트</h3>
            <p>금, 은, 구리, 석유, 석탄, 가스, 철</p>
            <canvas id="lineChart"></canvas>
        </div>
        <div class="box pie-charts">
            <div>
                <h4>생산 비율</h4>
                <canvas id="productionPie"></canvas>
            </div>
            <div>
                <h4>소비 비율</h4>
                <canvas id="consumptionPie"></canvas>
            </div>
        </div>
    </main>
    <script>
        // 여기에 차트.js 또는 다른 라이브러리를 활용한 스크립트를 추가하세요.
    </script>
</body>
</html>
