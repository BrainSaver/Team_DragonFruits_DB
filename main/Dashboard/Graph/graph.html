<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자원 가격 변화 그래프</title>
    <script src="https://cdn.jsdelivr.net/npm/luxon@2.3.0/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>자원 가격 변화</h1>
    <canvas id="resourceChart" width="400" height="200"></canvas>

    <script>
        const ctx = document.getElementById('resourceChart').getContext('2d');
        let chart;

        // 차트 초기화
        function initializeChart() {
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '자원 가격 변화',
                        data: [],
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 2,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'month', // 단위 설정 (여기서는 월 단위)
                                tooltipFormat: 'll HH:mm',
                            },
                            adapters: {
                                date: luxon // Luxon을 사용하여 날짜 어댑터 지정
                            }
                        },
                        y: { 
                            beginAtZero: false 
                        }
                    }
                }
            });
        }

        // FRED API에서 데이터 요청
        function fetchData() {
            const apiKey = '***REMOVED***';
            const seriesId = 'DTWEXBGS';
            const url = `https://api.stlouisfed.org/fred/series/observations?series_id=${seriesId}&api_key=${apiKey}&file_type=json`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const observations = data.observations;

                    const labels = [];
                    const values = [];

                    // 데이터 가공: 날짜와 값 추출
                    observations.forEach(item => {
                        const date = luxon.DateTime.fromISO(item.date); // ISO 형식으로 날짜 파싱
                        const value = parseFloat(item.value);

                        labels.push(date);
                        values.push(value);
                    });

                    // 차트 데이터 갱신
                    chart.data.labels = labels;
                    chart.data.datasets[0].data = values;
                    chart.update();
                })
                .catch(error => console.error('데이터 로드 실패:', error));
        }

        // 초기화 및 데이터 갱신
        initializeChart();
        fetchData(); // 페이지 로드 시 데이터 가져오기
        setInterval(fetchData, 60000); // 1분마다 데이터 갱신
    </script>
</body>
</html>
