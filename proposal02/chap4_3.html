
<!DOCTYPE html>
<html lang="ko"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 개요</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        section {
            margin-bottom: 20px;
        }
        h1, h2 {
            color: #333;
        }
        p {
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <h1>구글맵을 사용한 지도의 최근 발생한 사건의 상호작용 가능한 표시</h1>
        <h2>팀 드래곤프루트</h2>
    </header>
    <section>
        <h2>구현</h2>
        <p><li>발생한 사건의 위치를 구글 맵에 마커로 표시</li></p>
        <p><li>마커를 누르면 해당 사건에 대해 간략하게 설명</li></p>
        <p><li>기사로 바로 이동이 가능한 하이퍼링크</li></p>
    </section>
    <section>
        <h2>방법</h2>
        <p><li>googlemaps api를 사용해 마커를 생성</li></p>
        <p><li>마커 내에 사건의 내용 기술</li></p>
    </section>
</body>
</html>
