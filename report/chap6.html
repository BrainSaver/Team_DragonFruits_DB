<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파일 보기</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    h1 {
      text-align: center;
    }
    #iframeContainer {
      margin: 20px auto;
      border: 1px solid #ccc;
      padding: 10px;
      max-width: 800px;
    }
    iframe {
      width: 100%;
      height: 400px;
      border: none;
    }
    #buttonContainer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin: 20px auto;
      max-width: 800px;
    }
    .button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      border-radius: 5px;
      text-align: center;
    }
    .button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>파일 보기</h1>
  <iframe id="contentFrame" src=""></iframe>
  <div id="iframeContainer" class="iframe-container" style="display: none;">
    <p id="lineCount"></p>
  </div>
  <div id="buttonContainer">
    <!-- 버튼들이 이곳에 추가됩니다 -->
  </div>

  <script>
    const files = [
      "AccessDenied.txt",
      "circle.txt",
      "dashboard.txt",
      "deletecookie.txt",
      "EDBFiller.txt",
      "findID.txt",
      "findIDReply.txt",
      "googleMap.txt",
      "index.txt",
      "loginPage.txt",
      "loginReply.txt",
      "make_graph.txt",
      "makeAccount.txt",
      "makeAccountReply.txt",
      "makeDB.txt",
      "makeEDB.txt",
      "makeNewsDB.txt",
      "news.txt",
      "NewsDBFiller.txt",
      "realTime.txt",
      "RealTimeDB.txt",
      "RealTimeDBFiller.txt",
      "table.txt"
    ];

    // 각 파일의 줄 수를 기록하는 배열
    const lineCounts = [
      "22", // AccessDenied.txt
      "57", // circle.txt
      "87", // dashboard.txt
      "6", // deletecookie.txt
      "48", // EDBFiller.txt
      "24", // findID.txt
      "19", // findIDReply.txt
      "87", // googleMap.txt
      "4", // index.txt
      "27", // loginPage.txt
      "24", // loginReply.txt
      "102", // make_graph.txt
      "28", // makeAccount.txt
      "20", // makeAccountReply.txt
      "14", // makeDB.txt
      "35", // makeEDB.txt
      "17", // makeNewsDB.txt
      "90", // news.txt
      "67", // NewsDBFiller.txt
      "28", // realTime.txt
      "33", // RealTimeDB.txt
      "51", // RealTimeDBFiller.txt
      "41"  // table.txt
    ];

    const buttonContainer = document.getElementById('buttonContainer');
    const iframeContainer = document.getElementById('iframeContainer');
    const contentFrame = document.getElementById('contentFrame');
    const lineCountElement = document.getElementById('lineCount');

    files.forEach((file, index) => {
      const button = document.createElement('button');
      button.textContent = file;
      button.className = 'button';
      button.onclick = () => {
        iframeContainer.style.display = 'block';
        contentFrame.src = file;
        const lineCount = lineCounts[index] || "줄 수 미입력";
        lineCountElement.textContent = `파일: ${file} | 줄 수: ${lineCount}`;
      };
      buttonContainer.appendChild(button);
    });
  </script>
</body>
</html>
