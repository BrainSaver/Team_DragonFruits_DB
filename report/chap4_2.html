
<!DOCTYPE html>
<html lang="ko"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 개요</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        section {
            margin-bottom: 20px;
        }
        h1, h2 {
            color: #333;
        }
        p {
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <h1>바로가기 링크가 있는 뉴스 표시창</h1>
        <h2>팀 드래곤프루트</h2>
    </header>
    <section>
        <h2>구현</h2>
        <p><li>뉴스의 일부 내용과 제목을 출력</li></p>
        <p><li>기사로 바로 이동이 가능한 하이퍼링크</li></p>
    </section>
    <section>
        <h2>방법</h2>
        <p><li>newsapi.org 사이트를 사용(무료 플랜은 하루 100회의 호출 제한이 있음)</li></p>
        <p><li>api의 response에 있는 정보들로 상기 구현내용들 구현</li></p>
        <p><li>키워드를 검색하여 결과를 뉴스칸에 출력</li></p>
    </section>
</body>
</html>
