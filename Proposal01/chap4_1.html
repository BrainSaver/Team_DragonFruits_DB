<!DOCTYPE html>
<html lang="ko"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 개요</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        section {
            margin-bottom: 20px;
        }
        h1, h2 {
            color: #333;
        }
        p {
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <h1>로그인 및 회원가입 기능</h1>
        <h2>팀 드래곤프루트</h2>
    </header>
    <section>
        <h2>개인정보 보호</h2>
        <p><li>mysql AES 양방향 암호화를 사용, 보안 도모</li></p>
    </section>
    <section>
        <h2>작동방식</h2>
        <p><li>첫 접속 시 로그인 및 회원가입 창이 뜨고, 쿠키를 사용하여 재접속 시 로그인을 다시 할 일 없게 설정할 예정(유지시간 1시간)</li></p>
        <p><li>아이디, 비밀번호 찾기의 구현, 만약 로그인 시 아이디, 비밀번호가 틀렸다면, 접근거부 창 출력</li></p>
    </section>
</body>
</html>
